name: Build Design Tokens

on:
  push:
    paths:
      - 'design-tokens/**'
  pull_request:
    paths:
      - 'design-tokens/**'

jobs:
  build-design-tokens:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build design tokens
        working-directory: ./design-tokens
        run: pnpm build

      -uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Auto-commit updated styles
          commit_user_name: Design Token Action Bot
