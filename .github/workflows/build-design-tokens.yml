name: Build Design Tokens

on:
  push:
    paths:
      - 'design-tokens/**'
      - '.github/workflows/build-design-tokens.yml'
  pull_request:
    paths:
      - 'design-tokens/**'
      - '.github/workflows/build-design-tokens.yml'

jobs:
  build-design-tokens:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build design tokens
        working-directory: ./design-tokens
        run: pnpm build

      - uses: stefanzweifel/git-auto-commit-action@v7
        if: ${{ !env.ACT }}
        with:
          commit_message: Auto-commit updated styles
          commit_user_name: Design Token Action Bot
          commit_options: '--no-verify'
